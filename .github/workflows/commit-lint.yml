# Conventional Commits gate (commit messages + PR title). Runs on
# pull_request; .commitlintrc.yml applies. Job names keep the historical
# "caller / called" shape so branch-protection required checks keep matching.
name: Commit Lint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip body/footer line-length checks on Dependabot PRs: its auto-generated
  # bodies include long release-note URLs that can't be wrapped. The PR-title
  # job below still enforces conventional-commit format on the squash subject.
  commits:
    name: lint / Conventional Commits
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  pr-title:
    name: lint / Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
