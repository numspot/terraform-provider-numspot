# CI gate: generated-code drift, vet, build, race tests with coverage,
# golangci-lint, scaffold/registry drift + audit, and offline acceptance
# tests (VCR replay). Blocking. The job name keeps the historical
# "caller / called" shape so branch-protection required checks
# (go / lint, vet, build, test) keep matching.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go / lint, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `go generate ./...` runs `terraform fmt -recursive examples/` (see
      # main.go go:generate directives), and GitHub runners have no terraform:
      # install it from the HashiCorp apt repository. The exact version is
      # pinned so check-generated formatting stays reproducible; bump it
      # deliberately (verify the `-N` package revision exists in the repo).
      - name: Install pinned terraform
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg lsb-release
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y terraform=1.16.6-1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated code is current
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::Generated code is stale. Run 'go generate ./...' and commit the result."
            exit 1
          fi

      # Runs the lint gate AND puts the golangci-lint binary on PATH: the
      # scaffold drift check shells out to `golangci-lint fmt --stdin` during
      # its dry-run, so it must be installed before that step.
      #
      # v2.15 is the first release line built with go1.27.x; older binaries
      # cannot parse Go 1.27 stdlib export data (typecheck "export data
      # version 5 is greater than maximum supported version 4").
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          args: --timeout=5m

      # Scaffold/registry drift + scaffold audit, then the offline acceptance
      # tests (VCR replay). The acc tests are excluded from the default
      # `go test -race ./...` run by the `acc` build tag and made blocking
      # here instead.
      #
      # Replay mode never reaches the real API, but the provider still
      # validates its configuration at plan time, so the NUMSPOT_* values
      # must be set and non-empty. Hosts are ignored by the cassette matcher,
      # and space/organisation UUIDs are normalized to a fixed placeholder,
      # so any well-formed values work.
      - name: Scaffold drift + audit + offline acceptance tests
        env:
          NUMSPOT_HOST: https://api.acctest.invalid
          NUMSPOT_HOST_OS: https://objectstorage.acctest.invalid
          NUMSPOT_CLIENT_ID: 00000000-0000-0000-0000-000000000001
          NUMSPOT_CLIENT_SECRET: acctest-client-secret
          NUMSPOT_SPACE_ID: 00000000-0000-0000-0000-000000000000
          # Replay never reaches the real API, so status/retry polling only
          # needs to walk the recorded interactions: shrink the retry waits
          # (backoff between polls, hardcoded PreConfig sleeps are skipped by
          # acctest.Wait). Unset in production, where the 5s default applies.
          RETRY_BACKOFF: 10ms
        run: |
          make check-scaffold-drift && make check-registry-drift && make audit
          TF_ACC=1 VCR_MODE=replay go test -race -tags acc -timeout 20m ./internal/test

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race + cover)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
