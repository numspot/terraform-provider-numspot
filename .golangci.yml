run:
  # Prevent false positive timeouts in CI
  timeout: 5m

version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - err113
    - errcheck
    - errchkjson
    - errname
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - intrange
    - maintidx
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wrapcheck
    - funcorder
  settings:
    errchkjson:
      check-error-free-encoding: true
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*net/http.Server).Shutdown(context.Context)
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (io.Closer).Close
        - (net.Conn).Close
    goconst:
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
        - experimental
    gocyclo:
      min-complexity: 10
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - errcheck
        - misspell
      allow-unused: false
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
          severity: warning
          disabled: false
        - name: package-comments
          severity: warning
          disabled: true
        - name: var-naming
          arguments:
            - [
                ACL,
                API,
                CA,
                CPU,
                CSS,
                CSV,
                DNS,
                FTP,
                GB,
                HTML,
                HTTP,
                HTTPS,
                IAM,
                ICMP,
                ID,
                IMAP,
                IP,
                JSON,
                LB,
                MIME,
                NAT,
                NoSQL,
                PDF,
                RAM,
                SLA,
                SMTP,
                SQL,
                SSH,
                SSL,
                TCP,
                TB,
                TLS,
                UDP,
                UID,
                UUID,
                URL,
                VM,
                VPC,
                VPN,
                XML,
                YAML,
              ]
            - []
    sloglint:
      attr-only: true
    spancheck:
      checks:
        - end
    wrapcheck:
      extra-ignore-sigs:
        - .WrapError(
        - .WrapErrorf(
        # utils.retryContext is a deliberate pass-through wrapper around the
        # SDK retry helper (identical semantics, only the pacing changes when
        # RETRY_BACKOFF is set); callers wrap its error.
        - helper/retry.RetryContext(
        - .WaitForStateContext(
      ignore-package-globs:
        - google.golang.org/grpc/status
        - google.golang.org/grpc/internal/status
    funcorder:
      constructor: true
      struct-method: true
  exclusions:
    generated: lax
    paths:
      - internal/services/.+/.+_gen\.go$
      - internal/sdk/api/.+\.go$
      - internal/sdk/objectstorage/.+\.go$
      - third_party$
      - builtin$
      - examples$
    rules:
      # The terraform-plugin-framework generated New*Value constructors use
      # context.Background() internally, so every call site in scaffolded files
      # is flagged for not propagating its context. Excluding the call sites is
      # the pragmatic alternative to editing generated code.
      - path: internal/services/.+/resource_.+\.go$
        linters:
          - contextcheck
          - goconst
          - gocyclo
          # The generator wraps SDK string aliases (type X = string) in
          # string(...) conversions, which unconvert flags as no-ops.
          - unconvert
      - path: internal/services/.+/datasource_.+\.go$
        linters:
          - contextcheck
          - goconst
          - unconvert
      - path: internal/services/.+/helpers\.go$
        linters:
          - contextcheck
          # Helpers reuse the schema attribute names as raw map keys, mirroring
          # the generated serializers and the descriptor attribute names they
          # must match; the literals are also duplicated by the generated files.
          - goconst
      # helpers_test.go builds framework values through the generated
      # New*ValueMust constructors, which use context.Background() internally —
      # same root cause as the scaffolded call sites excluded above.
      - path: internal/services/.+/helpers_test\.go$
        linters:
          - contextcheck
      # gofumpt is enabled as a formatter (make fmt), not as a CI linter.
      # The formatter and linter disagree on formatting details, so exclude
      # gofumpt reports from 'golangci-lint run'.
      - path: .
        linters:
          - gofumpt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 150
      reformat-tags: false
    gci:
      sections:
        - standard
        - default
        - localmodule
        - blank
        - dot
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
