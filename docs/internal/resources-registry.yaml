  - name: nic
    terraform_name: numspot_nic
    category: Réseau
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: true
        polling_states:
          pending: [attaching]
          target: [attached]
        retry_pattern: RetryCreateUntilResourceAvailableWithBody + StateChangeConf inline (LinkNic.State)
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: true
        polling_states:
          pending: [in-use, detaching]
          target: [available]
        retry_pattern: RetryReadUntilStateValid + RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: Delete ignore silencieusement l'erreur d'unlink.

  - name: public_ip
    terraform_name: numspot_public_ip
    category: Réseau
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: false
        retry_pattern: RetryCreateUntilResourceAvailable + link direct
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: RetryDeleteUntilWithBody (unlink) + RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: ""

  - name: internet_gateway
