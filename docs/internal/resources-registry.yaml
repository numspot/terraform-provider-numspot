# Référentiel des ressources Terraform exposées par le provider NumSpot
#
# Ce fichier est la source de vérité. Il est utilisé par
# cmd/resource-registry/main.go pour générer RESOURCE_REGISTRY.md.
#
# Champ backend_statuses : à compléter ultérieurement à partir des repos
# backend (API NumSpot) pour lister les statuts réels possibles.

resources:
  # ============================================================
  # Services Managés
  # ============================================================
  - name: kubernetes_cluster
    terraform_name: numspot_kubernetes_cluster
    category: Services Managés
    owner_team: cloud-foundations-paas
    scope: space
    operations:
      create:
        async: true
        polling_states:
          pending: [PENDING, CREATING, DELETING]
          target: [RUNNING, FAILED]
        retry_pattern: RetryReadUntilStatusStateValidWithTimeout
        timeout_default: 15m
        timeout_configurable: true
      delete:
        async: false
        retry_pattern: RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: Seule ressource avec un timeout configurable via `timeouts.create`.

  - name: kubernetes_nodepool
    terraform_name: numspot_kubernetes_nodepool
    category: Services Managés
    owner_team: cloud-foundations-paas
    scope: space
    operations:
      create:
        async: false
        retry_pattern: Appel direct + ParseHTTPError
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: Appel direct + ParseHTTPError
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: Aucun retry ni state polling actuellement.

  - name: postgres_cluster
    terraform_name: numspot_postgres_cluster
    category: Services Managés
    owner_team: cloud-foundations-paas
    scope: space
    operations:
      create:
        async: true
        polling_states:
          pending: [PENDING, CREATING, DELETING]
          target: [RUNNING, FAILED]
        retry_pattern: RetryReadUntilStatusStateValid
        timeout_default: 15m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: ""

  # ============================================================
  # Compute
  # ============================================================
  - name: vm
    terraform_name: numspot_vm
    category: Compute
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: true
        polling_states:
          pending: [pending, stopping, shutting-down]
          target: [running, stopped, shutdown, terminated]
        retry_pattern: RetryCreateUntilResourceAvailableWithBody + RetryReadUntilStateValid
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: StopVM et StartVM utilisent aussi RetryReadUntilStateValid.

  - name: flexible_gpu
    terraform_name: numspot_flexible_gpu
    category: Compute
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: true
        polling_states:
          pending: [attaching, detaching]
          target: [allocated, attached]
        retry_pattern: RetryCreateUntilResourceAvailableWithBody + RetryReadUntilStateValid
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: RetryDeleteUntilResourceAvailable (+ RetryReadUntilStateValid sur unlink)
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: CRUD logic lives in internal/core/flexible_gpu.go; the resource/datasource delegate to core.

  - name: image
    terraform_name: numspot_image
    category: Compute
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: true
        polling_states:
          pending: [creating, pending]
          target: [available]
        retry_pattern: RetryCreateUntilResourceAvailableWithBody + RetryReadUntilStateValid
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: ""

  - name: keypair
    terraform_name: numspot_keypair
    category: Compute
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: false
        retry_pattern: RetryCreateUntilResourceAvailableWithBody
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: scaffold_check enabled; uses id_source mapping (Name is the resource identifier) and ComputedFields for read-only API fields.

  - name: security_group
    terraform_name: numspot_security_group
    category: Compute
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: false
        retry_pattern: RetryCreateUntilResourceAvailableWithBody
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: ""

  - name: security_group_rule
    terraform_name: numspot_security_group_rule
