        polling_states:
          pending: [creating, updating]
          target: [available, in-use]
        retry_pattern: RetryCreateUntilResourceAvailableWithBody + RetryUntilResourceAvailableWithBody + StateChangeConf inline (LinkedVolumes[0].State)
        timeout_default: 5m
        timeout_configurable: false
      delete:
        async: false
        retry_pattern: unlink (Stop/Start VM) + RetryDeleteUntilResourceAvailable
        timeout_default: 5m
        timeout_configurable: false
