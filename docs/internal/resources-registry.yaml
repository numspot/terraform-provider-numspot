        timeout_configurable: false
      delete:
        async: false
        retry_pattern: Appel direct + ParseHTTPError
        timeout_default: 5m
        timeout_configurable: false
    backend_statuses: []
    notes: Aucun wrapper de retry.

  - name: server_certificate
    terraform_name: numspot_server_certificate
    category: Compute
    owner_team: cloud-foundations-iaas
    scope: space
    operations:
      create:
        async: false
