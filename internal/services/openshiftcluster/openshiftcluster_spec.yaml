provider:
  name: numspot

resources:
  cluster:
    create:
      method: POST
      path: /openshift/spaces/{spaceId}/clusters
    update:
      method: POST
      path: /openshift/spaces/{spaceId}/clusters/{clusterId}
    delete:
      method: DELETE
      path: /openshift/spaces/{spaceId}/clusters/{clusterId}
    read:
      method: GET
      path: /openshift/spaces/{spaceId}/clusters/{clusterId}

data_sources:
  cluster:
    read:
      method: GET
      path: /openshift/spaces/{spaceId}/clusters
