provider:
  name: numspot

resources:
  kubernetes_nodepool:
    create:
      method: POST
      path: /kubernetes/spaces/{spaceId}/clusters/{clusterId}/nodePools
    delete:
      method: DELETE
      path: /kubernetes/spaces/{spaceId}/clusters/{clusterId}/nodePools/{nodePoolId}
    read:
      method: GET
      path: /kubernetes/spaces/{spaceId}/clusters/{clusterId}/nodePools/{nodePoolId}
    schema:
      # OAS-bump workaround: `name` (and the create body's) refs the new
      # StrictSlugMax63 allOf schema, which tfplugingen-openapi v0.3.0 cannot map
      # (it then skips the WHOLE resource schema). Ignored here and re-added flat
      # via descriptor synthetic_attributes + validators, security_group-style.
      ignores:
        - name

data_sources:
  kubernetes_nodepool:
    read:
      method: GET
      path: /kubernetes/spaces/{spaceId}/clusters/{clusterId}/nodePools
    schema:
      ignores:
        - items.name
