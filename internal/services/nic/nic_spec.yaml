provider:
  name: numspot

resources:
  nic:
    create:
      method: POST
      path: /compute/spaces/{spaceId}/nics
    delete:
      method: DELETE
      path: /compute/spaces/{spaceId}/nics/{id}
    read:
      method: GET
      path: /compute/spaces/{spaceId}/nics/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/nics/{id}

data_sources:
  nic:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/nics
