name: virtual_gateway
go_name: VirtualGateway
singular: VirtualGateway
plural: VirtualGateways
scope: space
has_tags: false
is_async: false
has_update: false
create_direct: false
has_resource: true
has_datasource: true
core:
  create:
    extra_args:
      - plan.VpcId.ValueString()
  delete:
    extra_args:
      - state.VpcId.ValueString()
  read_list:
    function_suffix: WithParams
exclude_from_request:
  - VpcId
computed_fields:
  - State
  - VpcToVirtualGatewayLinks
mapping_overrides:
  serialize:
    - path: vpc_id
      expression: types.StringValue(getVpcId(http.VpcToVirtualGatewayLinks))
      reason: top-level vpc_id is derived from the attached VPC link
    - path: vpc_to_virtual_gateway_links.vpc_id
      expression: types.StringValue(item.VpcId)
      reason: nested link already exposes the VPC id directly on VpcToVirtualGatewayLink
  deserialize:
    - path: vpc_to_virtual_gateway_links.vpc_id
      expression: tf.VpcId.ValueString()
      reason: nested vpc_id is set directly from the TF model
scaffold_check: true
spec_check: true
# Re-injected into *_spec.json by cmd/inject-schema-overrides after generate-spec.
# vpc_id is derived from VpcToVirtualGatewayLinks in serialize; the read model has
# no top-level vpc_id, so it is re-added here (its plan modifier is declared below).
synthetic_attributes:
  - path: vpc_id
    type: string
    value: computed_optional
    description: "The ID of the Vpc to which the virtual gateway is attached."
plan_modifiers:
  - path: vpc_id
    kind: requires_replace_if_configured
