provider:
  name: numspot

resources:
  vpc:
    create:
      method: POST
      path: /compute/spaces/{spaceId}/vpcs
    delete:
      method: DELETE
      path: /compute/spaces/{spaceId}/vpcs/{id}
    read:
      method: GET
      path: /compute/spaces/{spaceId}/vpcs/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/vpcs/{id}

data_sources:
  vpc:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/vpcs
