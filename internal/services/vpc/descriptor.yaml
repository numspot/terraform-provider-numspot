name: vpc
go_name: VPC
singular: Vpc
plural: VPCs
scope: space
has_tags: true
is_async: true
has_update: true
create_direct: false
has_resource: true
has_datasource: true
exclude_from_request:
  - DhcpOptionsSetId
computed_fields:
  - State
scaffold_check: true
spec_check: true

core:
  create:
    extra_args:
      - "plan.DhcpOptionsSetId.ValueString()"
  read_list:
    function_suffix: WithParams
    params_type: ReadVpcsParams
  delete:
    extra_args: []

# Re-injected into *_spec.json by cmd/inject-schema-overrides after generate-spec.
optionality:
  - path: dhcp_options_set_id
    value: computed_optional
plan_modifiers:
  - path: ip_range
    kind: requires_replace_if_configured
