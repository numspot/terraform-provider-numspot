name: subnet
go_name: Subnet
singular: Subnet
plural: Subnets
scope: space
has_tags: true
is_async: true
has_update: true
create_direct: false
has_resource: true
has_datasource: true

core:
  create:
    extra_args:
      - plan.MapPublicIpOnLaunch.ValueBool()
  read_list:
    function_suffix: WithParams
    params_type: ReadSubnetsParams
  update:
    calls:
      - function_name: UpdateSubnetAttributes
        when_changed:
          - MapPublicIpOnLaunch
        args:
          - state.Id.ValueString()
          - plan.MapPublicIpOnLaunch.ValueBool()
exclude_from_request:
  - MapPublicIpOnLaunch
computed_fields:
  - AvailableIpsCount
  - State
scaffold_check: true
spec_check: true
# Re-injected into *_spec.json by cmd/inject-schema-overrides after generate-spec.
# map_public_ip_on_launch is sent via create extra_args + UpdateSubnetAttributes,
# so it must stay user-settable (openapi derives `computed` from the read schema).
optionality:
  - path: map_public_ip_on_launch
    value: computed_optional
plan_modifiers:
  - path: availability_zone_name
    kind: requires_replace_if_configured
  - path: ip_range
    kind: requires_replace
  - path: vpc_id
    kind: requires_replace
