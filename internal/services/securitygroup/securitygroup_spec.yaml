provider:
  name: numspot

resources:
  security_group:
    create:
      method: POST
      path: /compute/spaces/{spaceId}/securityGroups
    delete:
      method: DELETE
      path: /compute/spaces/{spaceId}/securityGroups/{id}
    read:
      method: GET
      path: /compute/spaces/{spaceId}/securityGroups/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/securityGroups/{id}
    schema:
      # Rules are managed by the separate numspot_security_group_rule resource, not
      # inline on the security group. Dropping the rule subtree here also removes the
      # OAS-additive `security_groups_members` nested type whose duplicate name (under
      # both inbound and outbound) breaks framework codegen.
      ignores:
        - inboundRules
        - outboundRules

data_sources:
  security_group:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/securityGroups
    schema:
      ignores:
        - items.inboundRules
        - items.outboundRules
