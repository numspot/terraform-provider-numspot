provider:
  name: numspot

resources:
  load_balancer:
    create:
      method: POST
      path: /compute/spaces/{spaceId}/loadBalancers
    delete:
      method: DELETE
      path: /compute/spaces/{spaceId}/loadBalancers/{id}
    read:
      method: GET
      path: /compute/spaces/{spaceId}/loadBalancers/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/loadBalancers/{id}

data_sources:
  load_balancer:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/loadBalancers
