provider:
  name: numspot

resources:
  keypair:
    create:
      method: POST
      path: /compute/spaces/{spaceId}/keypairs
    delete:
      method: DELETE
      path: /compute/spaces/{spaceId}/keypairs/{id}
    read:
      method: GET
      path: /compute/spaces/{spaceId}/keypairs/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/keypairs/{id}

data_sources:
  keypair:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/keypairs
