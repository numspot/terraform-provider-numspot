      method: GET
      path: /compute/spaces/{spaceId}/internetGateways/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/internetGateways/{id}

data_sources:
  internet_gateway:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/internetGateways
