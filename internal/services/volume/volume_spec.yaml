provider:
  name: numspot

resources:
  volume:
    create:
      method: POST
      path: /compute/spaces/{spaceId}/volumes
    delete:
      method: DELETE
      path: /compute/spaces/{spaceId}/volumes/{id}
    read:
      method: GET
      path: /compute/spaces/{spaceId}/volumes/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/volumes/{id}

data_sources:
  volume:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/volumes
