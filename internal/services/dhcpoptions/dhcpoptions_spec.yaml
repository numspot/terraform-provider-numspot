provider:
  name: numspot

resources:
  dhcp_options:
    create:
      method: POST
      path: /compute/spaces/{spaceId}/dhcpOptions
    delete:
      method: DELETE
      path: /compute/spaces/{spaceId}/dhcpOptions/{id}
    read:
      method: GET
      path: /compute/spaces/{spaceId}/dhcpOptions/{id}
    update:
      method: PUT
      path: /compute/spaces/{spaceId}/dhcpOptions/{id}

data_sources:
  dhcp_options:
    read:
      method: GET
      path: /compute/spaces/{spaceId}/dhcpOptions
