name: nat_gateway
go_name: NatGateway
singular: NatGateway
plural: NatGateways
scope: space
has_tags: true
is_async: true
has_update: true
create_direct: false
has_resource: true
has_datasource: true
computed_fields:
  - PublicIps
  - State
  - VpcId
mapping_overrides:
  serialize:
    - path: public_ip_id
      expression: firstPublicIpId(http.PublicIps)
      reason: top-level public_ip_id is derived from the first associated public IP
    - path: public_ips.public_ip_id
      expression: types.StringPointerValue(item.PublicIpId)
      reason: nested public_ips already exposes the allocation id directly on PublicIpLight
  deserialize:
    - path: public_ips.public_ip_id
      expression: tf.PublicIpId.ValueStringPointer()
      reason: nested public_ip_id is set directly from the TF model
core:
  read_list:
    function_suffix: WithParams
    params_type: ReadNatGatewayParams
scaffold_check: true
spec_check: true
# Re-injected into *_spec.json by cmd/inject-schema-overrides after generate-spec.
requires_replace: [subnet_id]
